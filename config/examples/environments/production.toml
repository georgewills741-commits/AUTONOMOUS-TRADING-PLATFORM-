# Example of the environment-specific configuration of the production environment (MIG-010,
# OPS-004). Placeholder values only (GOV-017). Checked with
# `atp config check --env production --config-dir config/examples` (docs/development.md,
# "Configuration").

# The environment this file belongs to, one of OPS-004's six. The --env the command is run with
# must name the same one.
environment = "production"

# This environment's identifier (MIG-027).
environment_id = "example-production"

# The directory of this environment's permanent Parquet archive of market data (TEC-012), an
# absolute path.
archive_directory = "/srv/atp/archive"

# The PostgreSQL database that holds this environment's market data (TEC-006): its host and
# port, the database, its user, and the name of the declared "server" secret below that holds
# the user's password, never the password itself (SEC-005).
[database]
host = "db.example.invalid"
port = 5432
name = "atp"
user = "atp"
password_secret = "ATP_EXAMPLE_SERVER_CREDENTIAL"

# Each secret this environment needs, by name and kind, never by value: the value is read from
# the process environment variable of that name (SEC-005). The kinds are "server", "ai", and
# "trading"; only production may declare a trading-enabled credential (MODE-006, SEC-004), and
# no environment has one yet.
[[secrets]]
name = "ATP_EXAMPLE_SERVER_CREDENTIAL"
kind = "server"
