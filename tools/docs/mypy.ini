# Type-check settings for the documentation tools only (tools/docs/README.md): the level they were
# written and checked against, for Python 3.10, the oldest version they support. Run from the
# repository root: uv run mypy --config-file tools/docs/mypy.ini
[mypy]
files = tools/docs
python_version = 3.10
check_untyped_defs = True
