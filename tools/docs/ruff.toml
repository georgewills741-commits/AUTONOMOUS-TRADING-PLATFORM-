# Lint and format settings for the documentation tools only (tools/docs/README.md). The tools keep
# the rule set they were written and checked against, ruff's former default rules, and Python 3.10,
# the oldest version they support. The rest of the repository uses the project's settings in
# pyproject.toml.
include = ["*.py"]
target-version = "py310"

[lint]
select = ["E4", "E7", "E9", "F"]
